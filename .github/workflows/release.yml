name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Package extension
        run: zip "datadump-${{ github.ref_name }}.zip" manifest.json dump.html dump.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: datadump-${{ github.ref_name }}.zip

      - name: Update README download link
        run: |
          sed -i 's|\[`datadump-v[^`]*\.zip`\](https://github.com/livingston/onetab-datadump/releases/latest/download/datadump-v[^)]*\.zip)|[`datadump-${{ github.ref_name }}.zip`](https://github.com/livingston/onetab-datadump/releases/latest/download/datadump-${{ github.ref_name }}.zip)|' README.md

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update download link to ${{ github.ref_name }}"
          git push origin main
